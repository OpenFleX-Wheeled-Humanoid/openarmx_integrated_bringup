controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    swerve_drive_controller:
      type: swerve_controller/SwerveDriveController
    lift_position_controller:
      type: lift_slide_driver/ParamForwardingPositionController
    velocity_controller:
      type: lift_slide_driver/ParamForwardingVelocityController
    lift_state_controller:
      type: lift_slide_driver/LiftSlideStateController
    lift_manual_position_controller:
      type: lift_slide_driver/LiftSlideManualPositionController
    left_forward_position_controller:
      type: position_controllers/JointGroupPositionController
    right_forward_position_controller:
      type: position_controllers/JointGroupPositionController
    left_o6_position_controller:
      type: forward_command_controller/ForwardCommandController
    right_o6_position_controller:
      type: forward_command_controller/ForwardCommandController
    left_forward_effort_controller:
      type: forward_command_controller/ForwardCommandController
    right_forward_effort_controller:
      type: forward_command_controller/ForwardCommandController
    head_forward_position_controller:
      type: forward_command_controller/ForwardCommandController

joint_state_broadcaster:
  ros__parameters: {}

swerve_drive_controller:
  ros__parameters:
    steering_joint_names: [fl_steering_joint, fr_steering_joint, bl_steering_joint, br_steering_joint]
    wheel_joint_names: [fl_wheel_joint, fr_wheel_joint, bl_wheel_joint, br_wheel_joint]
    fl_steering_min: -1.5708
    fl_steering_max: 1.5708
    fr_steering_min: -1.5708
    fr_steering_max: 1.5708
    bl_steering_min: -1.5708
    bl_steering_max: 1.5708
    br_steering_min: -1.5708
    br_steering_max: 1.5708
    odom_frame_id: odom
    base_frame_id: base_link
    cmd_vel_topic: /cmd_vel
    debug_topic: /swerve_drive_controller/debug_states
    cmd_vel_timeout: 0.75
    publish_rate: 50.0
    debug_publish_rate: 20.0
    max_wheel_speed: 2.0
    wheel_accel_limit: 2.5
    steering_align_threshold: 0.10
    steering_stop_threshold: 1.05
    steering_slowdown_exponent: 1.5
    steering_global_stop_threshold: 0.45
    steering_global_slowdown_exponent: 2.5
    module_speed_deadband: 0.02
    steering_command_deadband: 0.02
    low_speed_steering_command_deadband: 0.10
    low_speed_steering_deadband_speed: 0.16
    enable_odom_tf: true

lift_position_controller:
  ros__parameters:
    joints: [lift_joint]
    interface_name: position
    command_topic: /lift_position_controller/commands

velocity_controller:
  ros__parameters:
    joints: [lift_joint]
    interface_name: velocity
    command_topic: /velocity_controller/commands

lift_state_controller:
  ros__parameters:
    joints: [lift_joint]

lift_manual_position_controller:
  ros__parameters:
    joints: [lift_joint]
    min_position_m: -0.750
    max_position_m: 0.400
    lower_switch_position_m: 0.000
    home_switch_position_m: 0.650
    upper_switch_position_m: 0.950
    max_velocity_mps: 0.10
    max_acceleration_mps2: 0.08
    max_deceleration_mps2: 0.12
    position_command_min_delta_m: 0.001
    target_tolerance_m: 0.0005
    velocity_tolerance_mps: 0.0005
    jog_target_lookahead_time_s: 0.25
    jog_min_target_lookahead_m: 0.010

left_forward_position_controller:
  ros__parameters:
    joints: [openarmx_left_joint1, openarmx_left_joint2, openarmx_left_joint3, openarmx_left_joint4, openarmx_left_joint5, openarmx_left_joint6, openarmx_left_joint7]

right_forward_position_controller:
  ros__parameters:
    joints: [openarmx_right_joint1, openarmx_right_joint2, openarmx_right_joint3, openarmx_right_joint4, openarmx_right_joint5, openarmx_right_joint6, openarmx_right_joint7]

left_o6_position_controller:
  ros__parameters:
    joints: [left_lh_thumb_cmc_pitch, left_lh_thumb_cmc_yaw, left_lh_index_mcp_pitch, left_lh_middle_mcp_pitch, left_lh_ring_mcp_pitch, left_lh_pinky_mcp_pitch]
    interface_name: position

right_o6_position_controller:
  ros__parameters:
    joints: [right_rh_thumb_cmc_pitch, right_rh_thumb_cmc_yaw, right_rh_index_mcp_pitch, right_rh_middle_mcp_pitch, right_rh_ring_mcp_pitch, right_rh_pinky_mcp_pitch]
    interface_name: position

left_forward_effort_controller:
  ros__parameters:
    joints: [openarmx_left_joint1, openarmx_left_joint2, openarmx_left_joint3, openarmx_left_joint4, openarmx_left_joint5, openarmx_left_joint6, openarmx_left_joint7]
    interface_name: effort
    command_interfaces: [effort]
    state_interfaces: [position]

right_forward_effort_controller:
  ros__parameters:
    joints: [openarmx_right_joint1, openarmx_right_joint2, openarmx_right_joint3, openarmx_right_joint4, openarmx_right_joint5, openarmx_right_joint6, openarmx_right_joint7]
    interface_name: effort
    command_interfaces: [effort]
    state_interfaces: [position]

head_forward_position_controller:
  ros__parameters:
    joints: [openarmx_head_yaw_joint, openarmx_head_pitch_joint]
    interface_name: position
